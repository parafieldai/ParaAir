<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3860 2540">
  <title>A laptop</title>
  <!-- Drawn for the ParaAir site: a plain laptop, not any maker's product. The screen is exactly 3024 x 1964 at
       (418, 288), and the lid starts 232 from the top; site/hero.css and web/hero/src/engine.js rely on both. -->
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34363C"/><stop offset="1" stop-color="#202125"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4C53"/><stop offset=".22" stop-color="#2E3035"/><stop offset="1" stop-color="#1A1B1E"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F2EA"/><stop offset=".55" stop-color="#ECE4D7"/><stop offset="1" stop-color="#DCCDB6"/></linearGradient>
    <radialGradient id="glow" cx=".22" cy=".12" r=".6"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="366" y="232" width="3128" height="2160" rx="72" fill="url(#lid)"/>
  <rect x="367.5" y="233.5" width="3125" height="2157" rx="70.5" fill="none" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="3"/>
  <rect x="392" y="258" width="3076" height="2108" rx="48" fill="#0C0C0E"/>
  <circle cx="1930" cy="273" r="6" fill="#26282D"/>
  <rect x="418" y="288" width="3024" height="1964" fill="url(#wall)"/>
  <rect x="418" y="288" width="3024" height="1964" fill="url(#glow)"/>
  <rect x="418" y="288" width="3024" height="64" fill="#FFFFFF" fill-opacity=".5"/>
  <g fill="#1D1D1F" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="29">
    <text x="470" y="331" font-weight="700">Finder</text>
    <text x="586" y="331">File</text>
    <text x="664" y="331">Edit</text>
    <text x="746" y="331">View</text>
    <text x="834" y="331">Go</text>
    <text x="896" y="331">Window</text>
    <text x="1030" y="331">Help</text>
    <text x="3390" y="331" text-anchor="end">Thu 10:24</text>
  </g>
  <!-- The ParaAir menu bar icon: the app's Glide mark as a one-colour template (macOS/App/BrandIconGeometry.swift). -->
  <g fill="#1D1D1F" transform="translate(2783.3 275.5) scale(.087)">
    <polygon points="252,432 706,282 568,580 496,490"/>
    <polygon points="496,490 568,580 408,742 420,538"/>
  </g>
  <g fill="none" stroke="#1D1D1F" stroke-width="4.5" stroke-linecap="round">
    <path d="M2900 314a34 34 0 0 1 44 0M2909 323a21 21 0 0 1 26 0"/>
    <rect x="2992" y="307" width="52" height="26" rx="7"/>
    <circle cx="3104" cy="318" r="11"/><path d="M3112 326l9 9"/>
  </g>
  <circle cx="2922" cy="332" r="4.5" fill="#1D1D1F"/>
  <rect x="2997" y="312" width="38" height="16" rx="3.5" fill="#1D1D1F"/>
  <path d="M3048 314v8" stroke="#1D1D1F" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M40 2392h3780v22c0 46-40 86-110 92l-150 12H300l-150-12c-70-6-110-46-110-92z" fill="url(#base)"/>
  <path d="M40 2393h3780" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="4"/>
</svg>
