# Landing page and update feed deploy (CD): site/ -> the Worker "paraair-site" (static assets) in Parafield's Cloudflare
# account, at https://paraair.parafield.ai. Configuration: site.wrangler.jsonc. See docs/ci-cd.md, "Site".
#
# Trigger: a push to main that touches site/ (or this deploy setup), or "Run workflow" on main.
# The job waits for a required reviewer on the "production" environment.
# Secret (environment secret of "production"):
#   CLOUDFLARE_API_TOKEN   API token for Parafield's account only: Account > Workers Scripts > Edit and
#                          Zone parafield.ai > Workers Routes > Edit (the custom domain already exists)
# Wrangler and its whole dependency tree come from .github/deploy-tools/package-lock.json
# (npm ci, install scripts off), so nothing unpinned runs while the token is in the environment.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site.wrangler.jsonc"
      - "scripts/check-site.py"
      - ".github/deploy-tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://paraair.parafield.ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Static checks of site/
        run: python3 -I scripts/check-site.py site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the pinned Wrangler
        run: npm ci --prefix .github/deploy-tools --ignore-scripts --no-audit --no-fund
      - name: Deploy site/ to the paraair-site Worker (paraair.parafield.ai)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN as a secret of the production environment (see docs/ci-cd.md, Site)."
            exit 1
          fi
          .github/deploy-tools/node_modules/.bin/wrangler deploy -c site.wrangler.jsonc
      - name: Check the live feed
        run: |
          curl -fsS -o "$RUNNER_TEMP/appcast.xml" "https://paraair.parafield.ai/appcast.xml?deploy=$GITHUB_SHA"
          cmp -s "$RUNNER_TEMP/appcast.xml" site/appcast.xml || { echo "::error::The live appcast differs from site/appcast.xml"; exit 1; }
