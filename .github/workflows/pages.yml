# Landing page deploy (CD): site/ -> Cloudflare Pages project "paraair" (https://paraair.pages.dev).
# See docs/ci-cd.md, "Site".
#
# Trigger: a push to main that touches site/ (or this deploy setup), or "Run workflow" on main.
# The job waits for a required reviewer on the "production" environment.
# Secrets (environment secrets of "production"):
#   CLOUDFLARE_API_TOKEN   API token with Account > Cloudflare Pages > Edit on the ParaAir account only
#   CLOUDFLARE_ACCOUNT_ID  that account's ID
# Wrangler and its whole dependency tree come from .github/deploy-tools/package-lock.json
# (npm ci, install scripts off), so nothing unpinned runs while the token is in the environment.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-site.py"
      - ".github/deploy-tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://paraair.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Static checks of site/
        run: python3 -I scripts/check-site.py site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the pinned Wrangler
        run: npm ci --prefix .github/deploy-tools --ignore-scripts --no-audit --no-fund
      - name: Deploy site/ to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the production environment."
            exit 1
          fi
          .github/deploy-tools/node_modules/.bin/wrangler pages deploy site \
            --project-name=paraair --branch=main --commit-hash="$GITHUB_SHA" \
            --commit-message="$(git log -1 --format=%s "$GITHUB_SHA")"
